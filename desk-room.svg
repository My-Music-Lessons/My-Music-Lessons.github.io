<?xml version="1.0" encoding="UTF-8"?>
<!-- THE ROOM BEHIND THE FRONT DESK BAND.
     Owner, 24 September: "come up with a really cool graphic in the background
     that looks like a front desk - office room ... always fit to screen ...
     never let copy muddy the graphic, the graphic should be nice blurred so
     text is always front."

     Drawn rather than photographed, in the product's own palette, so it can
     never drift from packages/ui/src/mml.css. Two blur planes, not one: the
     room is well out of focus and the counter is only softened, which is what
     a photograph across a reception actually looks like and what keeps the two
     shapes that carry the picture - the lit counter lip and the bell.

     It is a background-image rather than inline markup on purpose: it is
     decoration with nothing to announce, it caches, and the crop becomes a
     background-position the stylesheet can change per breakpoint. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="presentation" aria-hidden="true">
  <defs>
    <!-- DEPTH OF FIELD, NOT A FLAT BLUR. The room behind the counter is well
         out of focus; the counter and what sits on it are only softened. That
         is what a photograph of a reception actually looks like, and it keeps
         the two shapes that carry the picture - the lit counter lip and the
         bell - while everything that could compete with a headline dissolves
         into texture. -->
    <filter id="fdFar" x="-14%" y="-14%" width="128%" height="128%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="fdNear" x="-14%" y="-14%" width="128%" height="128%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>

    <linearGradient id="fdWall" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3d2749"/>
      <stop offset="0.58" stop-color="#311e3b"/>
      <stop offset="1" stop-color="#2b1933"/>
    </linearGradient>
    <linearGradient id="fdFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241429"/>
      <stop offset="1" stop-color="#2b1933"/>
    </linearGradient>
    <linearGradient id="fdGlass" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#d5fbff" stop-opacity="0.52"/>
      <stop offset="0.5" stop-color="#d8c1dd" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff98ae" stop-opacity="0.17"/>
    </linearGradient>
    <linearGradient id="fdSpill" x1="0.65" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#d5fbff" stop-opacity="0.115"/>
      <stop offset="0.62" stop-color="#d5fbff" stop-opacity="0.016"/>
      <stop offset="1" stop-color="#d5fbff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fdCounter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#674a75"/>
      <stop offset="0.28" stop-color="#4b3357"/>
      <stop offset="1" stop-color="#33223c"/>
    </linearGradient>
    <linearGradient id="fdLedge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6096"/>
      <stop offset="1" stop-color="#4e3660"/>
    </linearGradient>
    <linearGradient id="fdEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8c1dd" stop-opacity="0.05"/>
      <stop offset="0.3" stop-color="#d8c1dd" stop-opacity="0.38"/>
      <stop offset="0.62" stop-color="#f4eaf6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d8c1dd" stop-opacity="0.24"/>
    </linearGradient>
    <radialGradient id="fdPool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd6bf" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffd6bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fdHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d5fbff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#d5fbff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fdSign" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8c1dd" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#d8c1dd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fdTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1933" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2b1933" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fdBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1933" stop-opacity="0"/>
      <stop offset="1" stop-color="#2b1933" stop-opacity="0.34"/>
    </linearGradient>
    <radialGradient id="fdBellGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb9c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb9c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fdWarmWash" cx="0.74" cy="0.3" r="0.72">
      <stop offset="0" stop-color="#ffdcb8" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#ffc8d4" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffc8d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fdSunShaft" x1="0.66" y1="0" x2="0.16" y2="1">
      <stop offset="0" stop-color="#ffe9cf" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffdcc0" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffdcc0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fdSunBloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0dc" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#ffd6bf" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffd6bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fdSunPane" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fff6e8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffd6bf" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="fdWinClip"><rect x="812" y="96" width="196" height="236" rx="9"/></clipPath>
  </defs>

  <style>
    /* ONE CLOCK RUNS THE ROOM. Every plate below is on the same 9s alternate,
       so the room darkens and lights as one thing rather than as four things
       that happen to be moving. Eighteen seconds end to end. */
    .fd-night { animation: fd-night 9s ease-in-out infinite alternate; }
    .fd-warm { animation: fd-warm 9s ease-in-out infinite alternate; }
    .fd-sun { animation: fd-sun 9s ease-in-out infinite alternate; }
    .fd-pane { animation: fd-pane 9s ease-in-out infinite alternate; }
    /* The shaft is soft-edged for the same reason the room is: a crisp beam
       over a blurred reception reads as a mistake. Blurred here rather than in
       the filter above so the drift stays on transform. Its own slower drift,
       deliberately out of step with the light, so the two never line up into
       one obvious loop. */
    .fd-shaft {
      filter: blur(15px);
      animation:
        fd-shaft-light 9s ease-in-out infinite alternate,
        fd-shaft-drift 31s ease-in-out infinite alternate;
    }
    .fd-bloom { filter: blur(11px); }

    /* THE BELL PULLS INTO FOCUS TO RING. Owner, 24 September: "bring the bell
       into focus when it animates - more rugular". It is the only object in
       the room that ever becomes sharp, which is what makes it the thing you
       look at, and it is on its own short loop so it happens often enough to
       be caught. The blur is animated here rather than in the filter above
       because a filter primitive cannot be driven from CSS. */
    .fd-bell {
      filter: blur(3.4px);
      animation: fd-bell-focus 6s ease-in-out infinite;
    }
    .fd-bell-body {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: fd-bell 6s ease-in-out infinite;
    }
    .fd-bell-glow {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: fd-bell-glow 6s ease-in-out infinite;
    }
    .fd-bell-ring {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: fd-ring 6s cubic-bezier(0.2, 0.6, 0.3, 1) infinite;
    }
    .fd-bell-ring-2 { animation-delay: 0.3s; }
    .fd-bell-ring-3 { animation-delay: 0.6s; }

    @keyframes fd-night { from { opacity: 0.56; } to { opacity: 0; } }
    @keyframes fd-warm { from { opacity: 0; } to { opacity: 0.82; } }
    @keyframes fd-sun { from { opacity: 0.12; } to { opacity: 1; } }
    @keyframes fd-pane { from { opacity: 0.08; } to { opacity: 1; } }
    @keyframes fd-shaft-light { from { opacity: 0.05; } to { opacity: 1; } }
    @keyframes fd-shaft-drift {
      from { transform: translateX(-16px); }
      to { transform: translateX(20px); }
    }
    @keyframes fd-bell-focus {
      0%, 46% { filter: blur(3.4px); }
      56%, 74% { filter: blur(0px); }
      92%, 100% { filter: blur(3.4px); }
    }
    @keyframes fd-bell {
      0%, 48% { transform: rotate(0deg) scale(1); }
      54% { transform: rotate(-9deg) scale(1.06); }
      60% { transform: rotate(7deg) scale(1.06); }
      66% { transform: rotate(-4.5deg) scale(1.03); }
      72% { transform: rotate(2.5deg) scale(1.01); }
      80%, 100% { transform: rotate(0deg) scale(1); }
    }
    @keyframes fd-bell-glow {
      0%, 46% { opacity: 0; transform: scale(0.7); }
      56% { opacity: 1; transform: scale(1.15); }
      80%, 100% { opacity: 0; transform: scale(0.7); }
    }
    @keyframes fd-ring {
      0%, 48% { opacity: 0; transform: scale(0.4); }
      53% { opacity: 0.95; }
      88%, 100% { opacity: 0; transform: scale(5.4); }
    }

    /* The reader has asked for less, and an image cannot be told by the page
       that embeds it - so the guard has to live in here. The room settles to
       its lit state, not to its dark one: a reception with the lights off is
       not the still frame anybody wants. */
    @media (prefers-reduced-motion: reduce) {
      .fd-night, .fd-warm, .fd-sun, .fd-pane, .fd-shaft,
      .fd-bell, .fd-bell-body, .fd-bell-glow, .fd-bell-ring {
        animation: none;
      }
      .fd-night { opacity: 0.1; }
      .fd-warm { opacity: 0.7; }
      .fd-bell-glow, .fd-bell-ring { opacity: 0; }
    }
  </style>

  <!-- the ground is never blurred, so no filter edge can ever show -->
  <rect width="1200" height="760" fill="url(#fdWall)"/>
  <rect y="470" width="1200" height="290" fill="url(#fdFloor)"/>

  <!-- ================= FAR: well out of focus ================= -->
  <g filter="url(#fdFar)">
    <rect width="1200" height="760" fill="url(#fdWall)"/>
    <rect y="470" width="1200" height="290" fill="url(#fdFloor)"/>

    <g stroke="#664c70" stroke-opacity="0.22" stroke-width="2">
      <path d="M636 0V470M700 0V470M764 0V470M828 0V470M892 0V470M956 0V470M1020 0V470M1084 0V470M1148 0V470"/>
    </g>
    <path d="M560 470H1200" stroke="#664c70" stroke-opacity="0.4" stroke-width="2"/>

    <!-- the window, and the light it throws -->
    <ellipse cx="910" cy="214" rx="252" ry="226" fill="url(#fdHalo)"/>
    <g clip-path="url(#fdWinClip)">
      <rect x="812" y="96" width="196" height="236" fill="url(#fdGlass)"/>
      <g stroke="#2b1933" stroke-opacity="0.5" stroke-width="9">
        <path d="M910 96V332M812 214H1008"/>
      </g>
    </g>
    <rect x="812" y="96" width="196" height="236" rx="9" fill="none" stroke="#d8c1dd" stroke-opacity="0.34" stroke-width="4"/>
    <path d="M812 332 L1008 332 L1130 760 L600 760 Z" fill="url(#fdSpill)"/>

    <!-- the clock -->
    <g transform="translate(716 176)">
      <circle r="31" fill="none" stroke="#d8c1dd" stroke-opacity="0.4" stroke-width="5"/>
      <path d="M0 0V-19M0 0H13" stroke="#d8c1dd" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- the gallery wall: sheet music, framed -->
    <g fill="none" stroke="#d8c1dd" stroke-opacity="0.3" stroke-width="4">
      <rect x="1056" y="124" width="104" height="78" rx="5"/>
      <rect x="1056" y="220" width="48" height="60" rx="5"/>
      <rect x="1116" y="220" width="44" height="60" rx="5"/>
    </g>
    <g stroke="#d5fbff" stroke-opacity="0.3" stroke-width="3">
      <path d="M1068 145H1148M1068 159H1148M1068 173H1148M1068 187H1148"/>
    </g>
    <g fill="#ff98ae" fill-opacity="0.68">
      <ellipse cx="1086" cy="176" rx="7.5" ry="5.6"/>
      <ellipse cx="1113" cy="152" rx="7.5" ry="5.6"/>
      <ellipse cx="1136" cy="164" rx="7.5" ry="5.6"/>
    </g>
    <g stroke="#ff98ae" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round">
      <path d="M1093 176V148M1120 152V126M1143 164V138"/>
    </g>

    <!-- the lit sign behind the desk, deliberately wordless -->
    <ellipse cx="616" cy="252" rx="112" ry="82" fill="url(#fdSign)"/>
    <rect x="540" y="222" width="152" height="58" rx="29" fill="none" stroke="#d8c1dd" stroke-opacity="0.38" stroke-width="4"/>
    <g fill="#d8c1dd" fill-opacity="0.3">
      <rect x="565" y="242" width="44" height="9" rx="4.5"/>
      <rect x="565" y="257" width="82" height="9" rx="4.5"/>
    </g>

    <!-- the shelf: metronome, books, a plant -->
    <path d="M560 400H790" stroke="#d8c1dd" stroke-opacity="0.34" stroke-width="5" stroke-linecap="round"/>
    <g fill="#d8c1dd" fill-opacity="0.26">
      <path d="M590 400 L602 350 L626 350 L638 400 Z"/>
      <rect x="656" y="358" width="13" height="42" rx="2"/>
      <rect x="673" y="364" width="13" height="36" rx="2"/>
      <path d="M690 400 L704 366 L704 400 Z"/>
    </g>
    <path d="M610 396V358" stroke="#ff98ae" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
    <circle cx="610" cy="362" r="6" fill="#ff98ae" fill-opacity="0.78"/>
    <g fill="#6fd3ab" fill-opacity="0.34">
      <path d="M742 400c0-18 9-29 18-34-5 14-2 25 2 34z"/>
      <path d="M760 400c2-16 13-25 24-26-9 9-13 17-13 26z"/>
    </g>

    <!-- the chair behind the counter -->
    <g fill="#2a1a33" fill-opacity="0.92">
      <rect x="676" y="388" width="100" height="92" rx="27"/>
      <rect x="718" y="474" width="16" height="30"/>
    </g>
    <rect x="676" y="388" width="100" height="92" rx="27" fill="none" stroke="#d8c1dd" stroke-opacity="0.26" stroke-width="4"/>
  </g>

  <!-- SUN THROUGH THE WINDOW. Owner, 24 September: "animate it with sun
       shinning through it". Unfiltered and outside the blurred plane: a shaft
       this soft needs no blur, and animating inside a filter would re-run a
       full-scene convolution on every frame. It is one slow breath and one
       slower drift, so the light reads as the sun moving rather than as
       something flashing. -->
  <g class="fd-sun">
    <path class="fd-shaft" d="M806 326 L1014 326 L1152 760 L578 760 Z" fill="url(#fdSunShaft)"/>
    <ellipse class="fd-bloom" cx="910" cy="212" rx="228" ry="206" fill="url(#fdSunBloom)"/>
    <rect class="fd-pane" x="812" y="96" width="196" height="236" rx="9" fill="url(#fdSunPane)"/>
  </g>

  <!-- ============ NEAR: the counter, only softened ============ -->
  <g filter="url(#fdNear)">
    <ellipse cx="820" cy="534" rx="520" ry="34" fill="#160c1a" fill-opacity="0.5"/>
    <rect x="250" y="520" width="1010" height="240" rx="26" fill="url(#fdCounter)"/>
    <rect x="286" y="574" width="938" height="132" rx="14" fill="#2b1933" fill-opacity="0.3"/>
    <rect x="286" y="574" width="938" height="132" rx="14" fill="none" stroke="#d8c1dd" stroke-opacity="0.13" stroke-width="1.6"/>
    <path d="M686 574V706M1000 574V706" stroke="#d8c1dd" stroke-opacity="0.09" stroke-width="1.6"/>
    <rect x="228" y="486" width="1054" height="46" rx="16" fill="url(#fdLedge)"/>
    <rect x="228" y="486" width="1054" height="4.5" rx="2.25" fill="url(#fdEdge)"/>
    <rect x="228" y="527.5" width="1054" height="4.5" rx="2.25" fill="#160c1a" fill-opacity="0.45"/>
    <ellipse cx="880" cy="500" rx="320" ry="40" fill="url(#fdPool)"/>

    <!-- monitor, from behind -->
    <rect x="1062" y="372" width="152" height="94" rx="9" fill="#3a2745"/>
    <rect x="1062" y="372" width="152" height="94" rx="9" fill="none" stroke="#d8c1dd" stroke-opacity="0.24" stroke-width="1.8"/>
    <rect x="1129" y="466" width="18" height="16" fill="#3a2745"/>
    <rect x="1100" y="478" width="76" height="8" rx="4" fill="#4b3357"/>
    <circle cx="1138" cy="456" r="3.4" fill="#6fd3ab" fill-opacity="0.6"/>

    <!-- papers, askew -->
    <g transform="rotate(-4 976 476)">
      <rect x="932" y="462" width="90" height="22" rx="3" fill="#f4eaf6" fill-opacity="0.18"/>
    </g>
    <g transform="rotate(2.5 978 472)">
      <rect x="936" y="458" width="86" height="22" rx="3" fill="#f4eaf6" fill-opacity="0.28"/>
    </g>

    <!-- pen pot -->
    <rect x="1000" y="452" width="27" height="30" rx="5" fill="#4b3357"/>
    <rect x="1000" y="452" width="27" height="30" rx="5" fill="none" stroke="#d8c1dd" stroke-opacity="0.2" stroke-width="1.5"/>
    <g stroke-width="3.4" stroke-linecap="round">
      <path d="M1007 452V430" stroke="#d5fbff" stroke-opacity="0.5"/>
      <path d="M1014 452V424" stroke="#ff98ae" stroke-opacity="0.5"/>
      <path d="M1021 452V433" stroke="#d8c1dd" stroke-opacity="0.5"/>
    </g>

    <!-- mug -->
    <rect x="1040" y="456" width="27" height="26" rx="5" fill="#4b3357"/>
    <path d="M1067 463h8a7 7 0 0 1 0 13h-8" fill="none" stroke="#4b3357" stroke-width="4"/>
    <ellipse cx="1053" cy="457" rx="12.5" ry="3.4" fill="#d8c1dd" fill-opacity="0.24"/>

    <!-- plant -->
    <path d="M784 482h34l-4-24h-26z" fill="#4b3357"/>
    <g fill="#6fd3ab" fill-opacity="0.34">
      <path d="M801 458c0-21 10-33 20-38-5 16-3 29 2 38z"/>
      <path d="M801 458c-2-18-13-28-24-30 9 10 14 19 14 30z"/>
    </g>

    <!-- a small tent card -->
    <path d="M612 482 L632 448 L652 482 Z" fill="#f4eaf6" fill-opacity="0.15"/>
    <path d="M632 448V482" stroke="#f4eaf6" stroke-opacity="0.2" stroke-width="1.5"/>
  </g>


  <!-- THE BELL, RINGING. Owner, 24 September: "add animation to the bell
       also". Its own group so the softening filter runs over a bell-sized
       region rather than the whole counter. The ring is a ripple leaving the
       dome, not the dome flashing: a warm point that changes brightness reads
       as a fault, and one that sends a ring reads as a bell. -->
  <g class="fd-bell">
    <ellipse cx="866" cy="486" rx="32" ry="6" fill="#160c1a" fill-opacity="0.4"/>
    <g class="fd-bell-body">
      <rect x="836" y="472" width="60" height="10" rx="5" fill="#785384"/>
      <path d="M840 472a26 24 0 0 1 52 0z" fill="#ff98ae" fill-opacity="0.9"/>
      <path d="M847 466a19 17 0 0 1 21-14" stroke="#fff3f6" stroke-opacity="0.55" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <circle cx="866" cy="443" r="5" fill="#ff98ae"/>
    </g>
    <circle class="fd-bell-glow" cx="866" cy="462" r="54" fill="url(#fdBellGlow)"/>
    <circle class="fd-bell-ring" cx="866" cy="447" r="14" fill="none" stroke="#ff98ae" stroke-width="5"/>
    <circle class="fd-bell-ring fd-bell-ring-2" cx="866" cy="447" r="14" fill="none" stroke="#ffd6bf" stroke-width="4"/>
    <circle class="fd-bell-ring fd-bell-ring-3" cx="866" cy="447" r="14" fill="none" stroke="#fff3f6" stroke-width="3"/>
  </g>

  <!-- THE LIGHT IN THE ROOM. Owner, 24 September: "the sun needs to make the
       whole background darker then lighter - again way more obvious." So it
       is not a glint on the glass, it is the room losing and regaining its
       light over eighteen seconds. Both plates sit above everything the room
       is made of and below the settles, and neither of them touches the copy:
       the ground under the words is painted by the band's own stylesheet, so
       the text reads identically at the darkest and the brightest moment. -->
  <rect class="fd-night" width="1200" height="760" fill="#170c1c"/>
  <rect class="fd-warm" width="1200" height="760" fill="url(#fdWarmWash)"/>

  <!-- top and bottom settle, never blurred so no filter edge can show -->
  <rect width="1200" height="230" fill="url(#fdTop)"/>
  <rect y="560" width="1200" height="200" fill="url(#fdBottom)"/>
</svg>
